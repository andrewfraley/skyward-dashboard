# Everything is pinned (SHAs, hashes, digests), so nothing updates on its own.
# The cooldown only works where the registry reports publish dates, so every
# image comes from Docker Hub (scripts/check_base_images.sh enforces it) and
# uv comes from PyPI (tools/uv/requirements.txt), not from ghcr.io.
# Read the lock diff of any Dependabot PR before merging, since a hash only
# proves you got the version you asked for, not that the version is safe.
#
# Security updates only: `open-pull-requests-limit: 0` turns off routine
# version PRs, while security updates (on in the repo's settings) still arrive
# as soon as there's a fix; they ignore the limit, `ignore` and `cooldown`.
# Routine upgrades are done by hand. The one exception is the app's base
# images: Docker images get no security alerts, so their OS fixes only come
# as new digests, and those PRs stay on.
#
# The settings below shape version updates, so they matter only for the base
# images, or if a limit is lifted again:
#
# - cooldown: a new release isn't proposed until it's a week old. Hijacked
#   packages are usually caught and pulled within days.
# - Major versions (and new Python/Node releases) are left to a deliberate
#   upgrade PR: they change APIs and need code changes, not a bot bump.
# - increase-if-necessary: update the lock file, and leave the version ranges
#   in pyproject.toml and package.json alone unless an update needs them wider.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # security updates only
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # security updates only
    cooldown:
      default-days: 7
    # Every range in pyproject.toml is open-ended (>=), so every new version,
    # security fixes included, fits without touching it. increase-if-necessary
    # still raised the lower bounds to the version just locked, which is noise.
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # security updates only
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  # uv for the image build and CI, hash-pinned. From PyPI rather than the
  # ghcr.io image because PyPI has publish dates, so the cooldown works.
  - package-ecosystem: pip
    directory: /tools/uv
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # security updates only
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Only new digests for the same tag (a rebuilt python:3.12-slim with OS
  # fixes). Moving to a new Python or Node version is a deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The BuildKit and QEMU images CI builds with (tools/buildkit/Dockerfile,
  # read by the workflow, never built). New releases of the same major only.
  - package-ecosystem: docker
    directory: /tools/buildkit
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # security updates only
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
