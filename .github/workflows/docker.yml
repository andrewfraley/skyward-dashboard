name: Build and publish

# Releases happen when a person merges a pull request to main. If main's
# pyproject.toml has a version with no tag yet, the main build publishes the
# image as that version, then tags it and creates the GitHub release from
# docs/releases/<version>.md. Last, it moves the `stable` branch to the
# release, for a Home Assistant add-on to read (DEVELOPING.md, "Releases").

on:
  push:
    # Every branch builds, so a branch can be pulled and tried before it
    # merges. Only a release moves `latest`. `stable` is left out: the release
    # job moves it to a commit main already built, with a deploy key, and
    # unlike the workflow's own token that push starts a run.
    branches: ["**", "!stable"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A push to a PR branch starts two runs for the same commit (push and
# pull_request). Both building at once and writing the same build cache can
# stall the build, so the second waits for the first and then finds the cache
# fresh. Different commits still build in parallel.
concurrency:
  group: build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag like @v7 can be moved to other code; a SHA can't. Dependabot proposes
# updates (.github/dependabot.yml), and the repository requires SHA pins.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs on pull requests too, so a missing release note blocks the merge
      # instead of failing after the image is already published.
      - id: version
        name: Check the version and its release notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          ui=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          if [ "$version" != "$ui" ]; then
            echo "::error::pyproject.toml says $version but frontend/package.json says $ui. Bump both."
            exit 1
          fi
          release=false
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=true
            if [ ! -f "docs/releases/$version.md" ]; then
              echo "::error::$version has no tag yet, so merging this to main releases it. Add its release notes as docs/releases/$version.md."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Every image in the Dockerfile must be digest-pinned and from Docker Hub,
      # where Dependabot's cooldown works.
      - run: scripts/check_base_images.sh

      # The same versions the image installs, from uv.lock. setup-uv verifies
      # the uv download's checksum. The uv version is the one the Dockerfile
      # installs, read from the file Dependabot keeps current.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: tools/uv/requirements.txt
      - name: uv is the version tools/uv/requirements.txt pins
        run: |
          want=$(sed -nE 's/^uv==([^ ]+).*/\1/p' tools/uv/requirements.txt)
          have=$(uv --version | cut -d' ' -f2)
          if [ "$want" != "$have" ]; then
            echo "::error::setup-uv installed uv $have but tools/uv/requirements.txt pins $want"
            exit 1
          fi
      - run: uv lock --check
      # Default groups only (dev): no Playwright, which just the scripts/ tools need.
      - run: uv sync --frozen
      - run: .venv/bin/black --check .
      # The PII test skips here (CI has no local data to take terms from); the
      # fixture hygiene tests still run.
      - run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # frontend/.npmrc sets ignore-scripts, so no package runs code on install.
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/skyward-dashboard
      # Pull requests and forks have no Docker Hub credentials; they still
      # build, so a broken Dockerfile shows up before merge.
      PUSH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # A push to main (a merged PR) whose version has no tag yet: this build is the release.
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: github.event_name != 'pull_request' && env.PUSH != 'true'
        run: echo "::warning::Not publishing to Docker Hub — set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret."

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE != '/skyward-dashboard' && env.IMAGE || 'skyward-dashboard' }}
          # `latest` is the newest release, nothing else: it moves only when a
          # merge to main releases a new version (with 1.2.3 and 1.2 alongside).
          # Any other push, main included, gets its branch name (slashes become
          # dashes) and its commit sha, so a merge without a release, like a
          # Dependabot bump, reaches no one running `latest`.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ needs.test.outputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ needs.test.outputs.minor }},enable=${{ env.RELEASE }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach a record of how the image was built (commit, workflow, base
          # images) and an SBOM of every package in it, so anyone can check
          # what an image came from: `docker buildx imagetools inspect
          # <image>:latest --format '{{ json .Provenance }}'`.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: pushed
        run: echo "pushed=$PUSH" >> "$GITHUB_OUTPUT"

  release:
    needs: [test, image]
    # Only once the versioned image is really on Docker Hub, so a release never
    # points at an image that doesn't exist.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.outputs.release == 'true' && needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    # Only main may deploy to this environment (a branch policy on it), and it
    # holds STABLE_DEPLOY_KEY.
    environment: release
    permissions:
      contents: write
    steps:
      # The deploy key, not the workflow's token: that token may not push a
      # commit that changes .github/workflows/, and moving stable does. Full
      # history so the push below has every commit it names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.STABLE_DEPLOY_KEY }}
          fetch-depth: 0
      # Skipped if it already exists, so a re-run gets on to moving stable.
      - name: Tag v${{ needs.test.outputs.version }} and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Skyward Dashboard $VERSION" --notes-file "docs/releases/$VERSION.md"
      # A Home Assistant add-on is read from git, so it must only see a version
      # once that version's image exists: stable moves after the release, and
      # a failure here can't hold the release up for Docker users. No --force:
      # git refuses anything but a fast-forward, and pushing the same commit
      # again is a no-op.
      - name: Move stable to this release
        run: git push origin "$GITHUB_SHA:refs/heads/stable"
