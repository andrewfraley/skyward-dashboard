# Fetch, redraw, sleep. Shared by every display; see DISPLAY.md.
#
# Each wake: read the battery, switch Wi-Fi on, GET /api/display, switch Wi-Fi
# off, redraw only if something changed (or a button asked), then deep sleep
# until the dashboard's next update. A button press keeps the display awake for
# a short window in which further presses change page or student without
# fetching again. Every path, including every failure, ends in go_to_sleep.
#
# Needs from the device file: epd, deep_sleep_ctl, page_button, prev_button, student_button,
# wake_button, battery_voltage, status_led, read_battery, quiet_hardware.
# Needs from the layout: a lambda on epd that draws from the globals below.

substitutions:
  # dashboard_url has no default: set it in your own file, e.g. http://192.168.1.20:8080
  student: "-1" # -1 cycles through every student; 0, 1, ... pins this display to one
  button_window: 30s # how long a button press keeps it awake
  retry_minutes: "30" # sleep after a failed fetch
  maintenance_minutes: "5" # green button held at wake: stay up for OTA and logs

esphome:
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - script.execute: wake

json:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false # only on for the fetch
  fast_connect: true
  reboot_timeout: 0s # never reboot a battery device over Wi-Fi

logger:
  hardware_uart: UART0
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

http_request:
  timeout: 10s
  verify_ssl: false
  useragent: skyward-display

globals:
  - id: doc # the last /api/display response
    type: JsonDocument
  - id: fetched
    type: bool
    initial_value: "false"
  - id: students # how many the payload has
    type: int
    initial_value: "0"
  - id: page # 0 overview, 1 missing, 2 upcoming
    type: int
    initial_value: "0"
  - id: student_index
    type: int
    initial_value: "${student} < 0 ? 0 : ${student}"
  - id: screen # what the layout draws: 0 data, 1 can't reach, 2 battery empty, 3 maintenance
    type: int
    initial_value: "0"
  - id: battery_percent
    type: int
    initial_value: "-1"
  - id: sleep_ms
    type: uint32_t
    initial_value: "${retry_minutes} * 60000"
  # Kept in flash across deep sleep; written only when they change.
  - id: drawn_hash # what's on the panel now, 0 after an error screen
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: failures
    type: int
    restore_value: true
    initial_value: "0"

binary_sensor:
  - id: !extend page_button
    on_press:
      - if:
          condition:
            lambda: return id(fetched);
          then:
            - lambda: id(page) = (id(page) + 1) % 3;
            - script.execute: redraw
            - script.execute: stay_awake
  - id: !extend prev_button
    on_press:
      - if:
          condition:
            lambda: return id(fetched);
          then:
            - lambda: id(page) = (id(page) + 2) % 3;
            - script.execute: redraw
            - script.execute: stay_awake
  - id: !extend student_button
    on_press:
      - if:
          condition:
            lambda: return id(fetched) && ${student} < 0 && id(students) > 1;
          then:
            - lambda: |-
                id(student_index) = (id(student_index) + 1) % id(students);
                id(page) = 0;
            - script.execute: redraw
            - script.execute: stay_awake

script:
  - id: wake
    then:
      - script.execute: read_battery
      - script.wait: read_battery
      - lambda: |-
          // Seeed's curve for the E1001's cell: 3.3 V empty, 4.15 V full.
          float v = id(battery_voltage).state;
          if (!std::isnan(v))
            id(battery_percent) = std::clamp((int) ((v - 3.3f) / (4.15f - 3.3f) * 100), 0, 100);
      # Green button held at wake: maintenance mode.
      - if:
          condition:
            and:
              - lambda: return id(wake_button) == 2;
              - binary_sensor.is_on: student_button
          then:
            - delay: 2s
      - if:
          condition:
            and:
              - lambda: return id(wake_button) == 2;
              - binary_sensor.is_on: student_button
          then:
            - script.execute: maintenance
          else:
            - if:
                # Nearly empty: say so once and stay off Wi-Fi.
                condition:
                  lambda: return id(battery_percent) >= 0 && id(battery_percent) < 5;
                then:
                  - lambda: |-
                      id(screen) = 2;
                      id(sleep_ms) = 12 * 3600 * 1000;
                  - if:
                      condition:
                        lambda: return id(drawn_hash) != 2;
                      then:
                        - lambda: id(drawn_hash) = 2;
                        - script.execute: redraw
                  - script.execute: go_to_sleep
                else:
                  - script.execute: update

  - id: update
    then:
      - script.execute: fetch
      - script.wait: fetch
      - wifi.disable:
      - if:
          condition:
            lambda: return id(fetched);
          then:
            - lambda: |-
                id(failures) = 0;
                id(screen) = 0;
                // A button wake does what the button says, in one refresh.
                if (id(wake_button) == 1) id(page) = 1;
                if (id(wake_button) == 3) id(page) = 2;
                if (id(wake_button) == 2 && ${student} < 0 && id(students) > 1)
                  id(student_index) = (id(student_index) + 1) % id(students);
                if (id(student_index) >= id(students)) id(student_index) = 0;
                uint32_t s = id(doc)["sleep_seconds"] | 3600;
                s = std::clamp<uint32_t>(s, 15 * 60, 12 * 3600);
                if (id(battery_percent) >= 0 && id(battery_percent) < 15)
                  s = std::min<uint32_t>(s * 2, 12 * 3600);
                id(sleep_ms) = s * 1000;
            - if:
                condition:
                  lambda: |-
                    // The low-battery banner is part of what's drawn.
                    std::string hash = id(doc)["hash"] | "0";
                    uint32_t h = strtoul(hash.substr(0, 8).c_str(), nullptr, 16);
                    h ^= id(battery_percent) >= 0 && id(battery_percent) < 15;
                    bool changed = h != id(drawn_hash);
                    id(drawn_hash) = h;
                    // Flashed, reset or powered on: the layout may be new, so redraw.
                    bool cold = esp_reset_reason() != ESP_RST_DEEPSLEEP;
                    return changed || cold || id(wake_button) != 0;
                then:
                  - script.execute: redraw
                else:
                  - logger.log: Nothing changed; not redrawing
          else:
            - lambda: |-
                id(failures) += 1;
                id(sleep_ms) = ${retry_minutes} * 60000;
            # Keep the last good screen for a while; after 3 misses, say so.
            - if:
                condition:
                  lambda: return id(failures) >= 3 && id(drawn_hash) != 1;
                then:
                  - lambda: |-
                      id(screen) = 1;
                      id(drawn_hash) = 1;
                  - script.execute: redraw
      - if:
          condition:
            lambda: return id(wake_button) != 0 && id(fetched);
          then:
            - script.execute: button_window
          else:
            - script.execute: go_to_sleep

  - id: fetch
    then:
      - wifi.enable:
      - wait_until:
          condition: wifi.connected
          timeout: 15s
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: !lambda |-
                  // Accept dashboard_url with or without a trailing slash.
                  std::string base = "${dashboard_url}";
                  while (!base.empty() && base.back() == '/') base.pop_back();
                  return base + "/api/display?v=1";
                capture_response: true
                max_response_buffer_size: 16kB
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("skyward", "Dashboard answered HTTP %d", response->status_code);
                          return;
                        }
                        id(doc) = json::parse_json(body);
                        id(fetched) = (id(doc)["v"] | 0) == 1;
                        if (!id(fetched)) ESP_LOGW("skyward", "Not a v1 display payload");
                        id(students) = id(doc)["students"].size();
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: Couldn't reach the dashboard
          else:
            - logger.log:
                level: WARN
                format: Wi-Fi didn't connect

  - id: redraw
    mode: queued
    then:
      # One refresh at a time: the panel ignores an update while busy.
      - wait_until:
          condition:
            lambda: return id(epd).is_idle();
          timeout: 30s
      - component.update: epd
      - wait_until:
          condition:
            lambda: return id(epd).is_idle();
          timeout: 30s
      - safe_mode.mark_successful:

  # A press while awake: cancel any sleep under way and (re)start the window.
  - id: stay_awake
    then:
      - script.stop: go_to_sleep
      - script.execute: button_window

  # Each press restarts the window; when it runs out, back to the overview and sleep.
  - id: button_window
    mode: restart
    then:
      - output.turn_on: status_led # awake: a press changes the page
      - delay: ${button_window}
      - output.turn_off: status_led
      - if:
          condition:
            lambda: |-
              return id(page) != 0 || id(student_index) != (${student} < 0 ? 0 : ${student});
          then:
            - lambda: |-
                id(page) = 0;
                id(student_index) = ${student} < 0 ? 0 : ${student};
            - script.execute: redraw
      - script.execute: go_to_sleep

  - id: maintenance
    then:
      - deep_sleep.prevent: deep_sleep_ctl
      - output.turn_on: status_led # on for as long as it stays awake
      - lambda: id(screen) = 3;
      - wifi.enable:
      - wait_until:
          condition: wifi.connected
          timeout: 30s
      - script.execute: redraw
      - delay: ${maintenance_minutes}min
      - lambda: id(drawn_hash) = 0; # redraw the data on the next wake
      - deep_sleep.allow: deep_sleep_ctl
      - script.execute: go_to_sleep

  - id: go_to_sleep
    then:
      - script.wait: redraw
      - wifi.disable:
      - script.execute: quiet_hardware
      # A button still held would wake it again at once.
      - wait_until:
          condition:
            and:
              - binary_sensor.is_off: page_button
              - binary_sensor.is_off: prev_button
              - binary_sensor.is_off: student_button
          timeout: 30s
      - safe_mode.mark_successful:
      - lambda: ESP_LOGI("skyward", "Awake %u ms; sleeping %u s", millis(), id(sleep_ms) / 1000);
      - delay: 100ms # let the log drain
      - deep_sleep.enter:
          id: deep_sleep_ctl
          sleep_duration: !lambda return id(sleep_ms);
