# The 800x480 landscape layout: three pages per student and the status screens.
# Draws from common/skyward.yaml's globals; any 800x480 display can use it.
#
# Everything is black on white. Status is never shown by an inverted box alone:
# a struggling grade also gets a "!", and the header spells out any problem.

# Sizes are chosen so every stem is a whole number of pixels: at 1 bit per pixel
# a 2.5 px stem renders as a mix of 2 and 3, and letters look uneven. Measure
# before changing a size (DEVELOPING.md, "E-paper display").
font:
  - file: "gfonts://Inter@700"
    id: font_title # 4 px stems
    size: 27
    bpp: 1
  - file: "gfonts://Inter@700"
    id: font_grade # 5 px
    size: 34
    bpp: 1
  - file: "gfonts://Inter@700"
    id: font_heading # 4 px
    size: 27
    bpp: 1
  - file: "gfonts://Inter@600"
    id: font_body # 3 px
    size: 24
    bpp: 1
  - file: "gfonts://Inter@500"
    id: font_small # 2 px
    size: 18
    bpp: 1
  - file: "gfonts://Inter@700"
    id: font_number # 8 px: the missing count, read from across a room
    size: 53
    bpp: 1
  # White text on black loses its thin strokes to ink bleed on e-paper, so
  # anything reversed out of black is bold.
  - file: "gfonts://Inter@700"
    id: font_reversed # 3 px
    size: 20
    bpp: 1
  - file: "gfonts://Inter@700"
    id: font_huge # 7 px
    size: 47
    bpp: 1

display:
  - id: !extend epd
    lambda: |-
      // epaper_spi treats "on" as white, like paper: ink is Color::BLACK.
      const Color ink = Color::BLACK, paper = Color::WHITE;
      const int W = 800, H = 480, M = 20, HEADER = 56;

      // Text cut to a width, with "..." when it doesn't fit.
      auto fit = [&](display::BaseFont *f, std::string s, int width) -> std::string {
        int x, y, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x, &y, &w, &h);
        if (w <= width) return s;
        while (!s.empty()) {
          s.pop_back();
          std::string t = s + "...";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x, &y, &w, &h);
          if (w <= width) return t;
        }
        return "";
      };
      auto text = [&](int x, int y, display::BaseFont *f, Color c, TextAlign a, const std::string &s) {
        it.print(x, y, f, c, a, s.c_str());
      };
      auto centred = [&](int y, display::BaseFont *f, const std::string &s) {
        text(W / 2, y, f, ink, TextAlign::TOP_CENTER, fit(f, s, W - 2 * M));
      };

      // Status screens: no data, or no data worth trusting.
      if (id(screen) != 0) {
        it.rectangle(M / 2, M / 2, W - M, H - M, ink);
        if (id(screen) == 1) {
          centred(170, id(font_huge), "Can't reach the dashboard");
          centred(250, id(font_body), "Check that it's running and on this network.");
          centred(285, id(font_body), "Trying again every ${retry_minutes} minutes.");
        } else if (id(screen) == 2) {
          centred(170, id(font_huge), "Battery empty");
          centred(250, id(font_body), "Charge it to bring the dashboard back.");
        } else {
          centred(150, id(font_huge), "Maintenance mode");
          centred(230, id(font_body), "Awake for ${maintenance_minutes} minutes for updates and logs.");
          char ip[network::IP_ADDRESS_BUFFER_SIZE];
          network::get_ip_addresses()[0].str_to(ip);
          centred(265, id(font_body), std::string("Address: ") + ip);
        }
        return;
      }

      JsonObject root = id(doc).as<JsonObject>();
      JsonArray students = root["students"];
      if (students.size() == 0) {
        centred(200, id(font_huge), "No students yet");
        centred(270, id(font_body), "The dashboard hasn't finished its first update.");
        return;
      }
      JsonObject s = students[id(student_index)];
      const char *pages[] = {"Overview", "Missing", "Coming up"};
      int p = id(page);

      auto width_in = [&](display::BaseFont *f, const std::string &t) {
        int a, b, w, h;
        it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &a, &b, &w, &h);
        return w;
      };
      // Rounded rectangle, filled.
      auto rrect = [&](int x, int y, int w, int h, int r, Color c) {
        for (int dy = 0; dy < h; dy++) {
          float d = dy < r ? r - dy - 0.5f : (dy >= h - r ? dy - (h - r) + 0.5f : 0.f);
          int inset = d > 0 ? (int) std::lround(r - std::sqrt(std::max(0.f, r * r - d * d))) : 0;
          it.horizontal_line(x + inset, y + dy, w - 2 * inset, c);
        }
      };

      // Header: black on white like the web page, with a heavy rule under it.
      // Name and page on the left, freshness and battery on the right.
      std::string name = s["name"] | "";
      std::string title = p == 0 ? name + "'s grades" : name + "  -  " + pages[p];
      text(M, 12, id(font_title), ink, TextAlign::TOP_LEFT, title);
      int dots_x = M + width_in(id(font_title), title) + 22;
      for (int i = 0; i < 3; i++) {  // page dots, filled for this page
        int cx = dots_x + i * 18;
        if (i == p) it.filled_circle(cx, 27, 6, ink); else it.circle(cx, 27, 6, ink);
      }
      std::string status;
      const char *err = root["sync_error"] | "";
      if (*err) status = err;
      else if (root["stale"] | false) status = std::string("Not updated since ") + (root["updated"] | "?");
      else status = std::string("Updated ") + (root["updated"] | "");
      int batt = id(battery_percent);
      if (batt >= 0) status += batt < 15 ? "  |  Charge me " + std::to_string(batt) + "%" : "  |  " + std::to_string(batt) + "%";
      int right_start = dots_x + 3 * 18 + 12;
      text(W - M, 17, id(font_small), ink, TextAlign::TOP_RIGHT, fit(id(font_small), status, W - M - right_start));
      it.filled_rectangle(0, HEADER - 4, W, 3, ink);

      // A list row: title on the left, a label on the right, course under the title.
      auto item = [&](int x, int y, int width, JsonObject a, const char *label_key) {
        std::string label = a[label_key] | "";
        int bx, by, bw, bh;
        it.get_text_bounds(0, 0, label.c_str(), id(font_small), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        text(x, y, id(font_body), ink, TextAlign::TOP_LEFT, fit(id(font_body), a["title"] | "", width - bw - 12));
        text(x + width, y + 3, id(font_small), ink, TextAlign::TOP_RIGHT, label);
        text(x, y + 25, id(font_small), ink, TextAlign::TOP_LEFT, fit(id(font_small), a["course"] | "", width));
      };
      auto more = [&](int x, int y, int n) {
        if (n > 0) text(x, y, id(font_small), ink, TextAlign::TOP_LEFT, "+ " + std::to_string(n) + " more");
      };
      auto heading = [&](int x, int y, const std::string &h, int count) {
        text(x, y, id(font_heading), ink, TextAlign::TOP_LEFT, h);
        if (count < 0) return;
        int hx, hy, hw, hh;
        it.get_text_bounds(x, y, h.c_str(), id(font_heading), TextAlign::TOP_LEFT, &hx, &hy, &hw, &hh);
        std::string n = std::to_string(count);  // count in an inverted badge
        int nx, ny, nw, nh;
        it.get_text_bounds(0, 0, n.c_str(), id(font_reversed), TextAlign::TOP_LEFT, &nx, &ny, &nw, &nh);
        it.filled_rectangle(x + hw + 10, y + 1, nw + 16, 27, ink);
        text(x + hw + 18, y + 3, id(font_reversed), paper, TextAlign::TOP_LEFT, n);
      };

      JsonObject missing = s["missing"], upcoming = s["upcoming"];
      int top = HEADER + 16;

      if (p == 0) {
        // Left: grades. Right: missing and upcoming, three each.
        const int COL = 425;
        auto width_of = [&](const char *t) {
          int x, y, w, h;
          it.get_text_bounds(0, 0, t, id(font_grade), TextAlign::TOP_LEFT, &x, &y, &w, &h);
          return w;
        };
        int LETTER_W = 0;
        for (const char *l : {"A", "B", "C", "D", "F"}) LETTER_W = std::max(LETTER_W, width_of(l));
        const int MOD_W = std::max(width_of("+"), width_of("-")) + 2, BANG_W = width_of("!") + 2, PAD = 6;
        const int GRADE_X = COL - 112 - (LETTER_W + MOD_W + BANG_W + PAD);  // clear of the percent
        int y = top;
        JsonArray grades = s["grades"];
        int rows = std::min<int>(grades.size(), 9);
        int step = rows > 7 ? 42 : 50;
        for (int i = 0; i < rows; i++) {
          JsonObject g = grades[i];
          bool low = g["struggling"] | false;
          std::string grade = g["letter"] | "";
          std::string letter = grade.substr(0, 1), modifier = grade.size() > 1 ? grade.substr(1) : "";
          text(M, y + 8, id(font_body), ink, TextAlign::TOP_LEFT, fit(id(font_body), g["course"] | "", GRADE_X - 12 - M));
          // Fixed slots, so letters and modifiers line up down the column: the
          // letter centred in the width of the widest one, then +/-, then "!".
          Color fg = ink;
          if (low) {  // inverted, and the "!" says the same thing without the box
            it.filled_rectangle(GRADE_X - PAD, y, LETTER_W + MOD_W + BANG_W + 2 * PAD, 42, ink);
            fg = paper;
            text(GRADE_X + LETTER_W + MOD_W, y + 3, id(font_grade), fg, TextAlign::TOP_LEFT, "!");
          }
          text(GRADE_X + LETTER_W / 2, y + 3, id(font_grade), fg, TextAlign::TOP_CENTER, letter);
          text(GRADE_X + LETTER_W, y + 3, id(font_grade), fg, TextAlign::TOP_LEFT, modifier);
          text(COL - 20, y + 8, id(font_body), ink, TextAlign::TOP_RIGHT, g["percent"] | "");
          y += step;
        }
        if (grades.size() == 0) text(M, y, id(font_body), ink, TextAlign::TOP_LEFT, "No grades yet");
        it.vertical_line(COL, top, H - top - M, ink);

        int x = COL + 20, width = W - M - x;
        y = top;
        // The missing count, big enough to read from across a room: black when
        // there's any, an outline when there's none.
        int n = missing["count"] | 0;
        JsonArray mi = missing["items"];
        const int BH = 66;
        if (n > 0) {
          rrect(x, y - 4, width, BH, 12, ink);
          std::string num = std::to_string(n);
          text(x + 16, y + 2, id(font_number), paper, TextAlign::TOP_LEFT, num);
          int lx = x + 16 + width_in(id(font_number), num) + 14;
          text(lx, y + 8, id(font_reversed), paper, TextAlign::TOP_LEFT, "missing");
          text(lx, y + 32, id(font_reversed), paper, TextAlign::TOP_LEFT, "this grading period");
        } else {
          rrect(x, y - 4, width, BH, 12, ink);
          rrect(x + 3, y - 1, width - 6, BH - 6, 9, paper);
          text(x + width / 2, y + 16, id(font_heading), ink, TextAlign::TOP_CENTER, "All caught up");
        }
        y += BH + 8;
        int shown_missing = std::min<int>(mi.size(), 3);
        for (int i = 0; i < shown_missing; i++, y += 52) item(x, y, width, mi[i], "due");
        if (n > shown_missing) { more(x, y, n - shown_missing); y += 24; }
        // Coming up takes whatever room is left.
        y += 14;
        n = upcoming["count"] | 0;
        heading(x, y, "Coming up", -1);
        y += 36;
        JsonArray ui = upcoming["items"];
        if (n == 0) text(x, y, id(font_body), ink, TextAlign::TOP_LEFT, "Nothing due");
        int room = (H - M - y) / 52;
        if (n > room) room = (H - M - 24 - y) / 52;  // leave a line for "+ N more"
        int shown_upcoming = std::max(0, std::min<int>(ui.size(), room));
        for (int i = 0; i < shown_upcoming; i++, y += 52) item(x, y, width, ui[i], "due");
        more(x, y, n - shown_upcoming);
        return;
      }

      // Pages 1 and 2: one line per assignment, in two columns of up to 6.
      JsonObject list = p == 1 ? missing : upcoming;
      JsonArray items = list["items"];
      int count = list["count"] | 0;
      heading(M, top, p == 1 ? "Missing this grading period" : "Coming up", count);
      if (count == 0) {
        text(M, top + 50, id(font_body), ink, TextAlign::TOP_LEFT, p == 1 ? "All caught up" : "Nothing due");
        return;
      }
      const int colw = (W - 3 * M) / 2;
      int shown = std::min<int>(items.size(), 12);
      for (int i = 0; i < shown; i++) {
        int x = M + (i / 6) * (colw + M), y = top + 44 + (i % 6) * 56;
        item(x, y, colw, items[i], "due");
      }
      more(M, H - M - 18, count - shown);
